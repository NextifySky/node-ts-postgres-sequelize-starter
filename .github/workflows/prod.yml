name: CI/CD Pipeline for Development (Production)

on:
  push:
    branches:
      - main # Trigger the pipeline on push to the `main` branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t zainwaseem/clutch-app:prod .

      # Step 5: Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push zainwaseem/clutch-app:prod

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Step 6: SSH into the server (Ensure SSH keys are set up as secrets in GitHub)
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Step 7: Pull the latest Docker image for staging
            docker pull zainwaseem/clutch-app:prod

            # Step 8: Stop and remove existing containers for staging
            docker-compose -f /home/zain/clutch-app/docker-compose.yml down

            # Step 9: Rebuild and restart containers for staging
            docker-compose -f /home/zain/clutch-app/docker-compose.yml up -d

            # Step 10: Run migrations
            docker exec -T node-app npx sequelize-cli db:migrate --env development
